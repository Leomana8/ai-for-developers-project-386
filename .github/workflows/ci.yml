name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser booking test
        run: npm run test:e2e

      - name: Upload browser test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: booking-e2e-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Check OpenAPI spec up to date
        run: npm run spec:check

      - name: Check client SDK types up to date
        run: npm run spec:client:check

      - name: Check server types up to date
        run: npm run spec:server:check
